version: '3.9'

services:
  backend:
    build:
      context: ./server
    container_name: portfolio-backend
    ports:
      - "4000:4000"
    environment:
      PORT: 4000

  frontend:
    build:
      context: ./client
    container_name: portfolio-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://backend:4000
